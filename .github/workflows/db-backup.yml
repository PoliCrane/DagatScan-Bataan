name: Daily Database Backup

on:
  schedule:
    # 18:00 UTC = 2:00 AM PHT (UTC+8) — adjust if a different time is preferred.
    - cron: "0 18 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      # Ubuntu's default apt package for postgresql-client trails Supabase's
      # actual Postgres version (was 16, Supabase runs 17) — pg_dump refuses
      # to dump from a server newer than itself. Installing from PGDG (the
      # official PostgreSQL apt repo) instead lets us pin the exact matching
      # major version.
      - name: Install postgresql-client 17 (matches Supabase's Postgres version)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          yes | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          sudo apt-get install -y postgresql-client-17

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Run backup script
        working-directory: backend
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          BACKUP_ALERT_EMAIL: ${{ secrets.BACKUP_ALERT_EMAIL }}
        run: node scripts/dbBackup.js
